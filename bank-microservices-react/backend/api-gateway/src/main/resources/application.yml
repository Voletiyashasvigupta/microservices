server:
  port: 8765

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: account-service
          uri: lb://ACCOUNTS
          predicates:
            - Path=/api/v1/accounts,/api/v1/accounts/**
          filters:
            - AuthenticationFilter
        - id: customer-service
          uri: lb://CUSTOMER
          predicates:
            - Path=/api/v1/customers,/api/v1/customers/**
          filters:
            - AuthenticationFilter

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret: "local-demo-secret-change-this-before-production-123456789"

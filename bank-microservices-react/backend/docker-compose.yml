services:
  service-registry:
    build: ./service-registry
    image: microservices-service-registry:latest
    container_name: microservices-service-registry
    ports:
      - "8761:8761"
    networks:
      - csbmicroservicesnetwork
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    image: microservices-api-gateway:latest
    container_name: microservices-api-gateway
    ports:
      - "8765:8765"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    networks:
      - csbmicroservicesnetwork
    depends_on:
      - service-registry
    restart: on-failure

  auth-service:
    build: ./auth-service
    image: microservices-auth-service:latest
    container_name: microservices-auth-service
    ports:
      - "9898:9898"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    networks:
      - csbmicroservicesnetwork
    depends_on:
      - service-registry
    restart: on-failure

  customer-service:
    build: ./customer-service
    image: microservices-customer-service:latest
    container_name: microservices-customer-service
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/bank_customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - csbmicroservicesnetwork
    depends_on:
      - service-registry
    restart: on-failure

  account-service:
    build: ./account-service
    image: microservices-account-service:latest
    container_name: microservices-account-service
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/bank_account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - csbmicroservicesnetwork
    depends_on:
      - service-registry
    restart: on-failure

  frontend:
    build: ../frontend
    image: microservices-frontend:latest
    container_name: microservices-frontend
    ports:
      - "3000:80"
    networks:
      - csbmicroservicesnetwork
    depends_on:
      - api-gateway
      - auth-service
    restart: on-failure

networks:
  csbmicroservicesnetwork:
    name: csbmicroservicesnetwork
